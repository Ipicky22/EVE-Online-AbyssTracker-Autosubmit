<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abyssup</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  form { display: grid; gap: .75rem; }
  label { display: grid; gap: .25rem; font-weight: 600; }
  select, input, button { font: inherit; padding: .5rem; }
  button { cursor: pointer; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .state { padding: .5rem .75rem; border-left: .25rem solid; margin: 1rem 0; }
  .on { border-color: #2a9d4b; }
  .off { border-color: #888; }
  pre { white-space: pre-wrap; margin: 0; font: inherit; }
  details { margin-top: 2rem; }
  summary { cursor: pointer; font-weight: 600; margin-bottom: .75rem; }
  small { font-weight: 400; opacity: .75; }
  label.check { display: flex; gap: .5rem; align-items: baseline; font-weight: 400; }
  label.check small { display: block; }
</style>
</head>
<body>
<h1>abyssup{{if .DryRun}} <small>({{.L.dryRunBanner}})</small>{{end}}</h1>

<div class="state {{if .Active}}on{{else}}off{{end}}" role="status">
  <strong>{{if .Active}}{{.L.sessionOn}}{{else}}{{.L.sessionOff}}{{end}}</strong>
  {{if .Character}}— {{.Character}}{{end}}
  {{if .Status}}<pre>{{.Status}}</pre>{{end}}
</div>

<form method="post" action="/session/start">
  <div class="row">
    <label>{{.L.weather}}
      <select name="weather">
        {{range .Weathers}}<option {{if eq . $.S.Weather}}selected{{end}}>{{.}}</option>{{end}}
      </select>
    </label>
    <label>{{.L.tier}}
      <select name="tier">
        {{range $i, $n := .Tiers}}<option value="{{$i}}" {{if eq $i $.S.Tier}}selected{{end}}>T{{$i}} – {{$n}}</option>{{end}}
      </select>
    </label>
  </div>
  <label>{{.L.hull}}
    <select name="hull">
      {{range .Hulls}}<option {{if eq . $.S.Hull}}selected{{end}}>{{.}}</option>{{end}}
    </select>
  </label>
  <label>{{.L.fit}} <small>{{if .FitsErr}}{{.FitsErr}}{{else if not .HasKey}}{{.L.fitNeedsToken}}{{end}}</small>
    <select name="fit">
      <option value="">{{.L.none}}</option>
      {{range .Fits}}<option value="{{.ID}}" {{if eq .ID $.S.FitID}}selected{{end}}>{{.Ship.Name}} — {{.Name}}</option>{{end}}
    </select>
  </label>
  <label class="check">
    <input type="checkbox" name="all_cans" {{if .S.AllCans}}checked{{end}}>
    <span>{{.L.allCans}} <small>{{.L.allCansHelp}}</small></span>
  </label>
  <button type="submit">{{if .Active}}{{.L.updateSession}}{{else}}{{.L.startSession}}{{end}}</button>
</form>
{{if .Active}}
<form method="post" action="/session/stop" style="margin-top:.75rem">
  <button type="submit">{{.L.endSession}}</button>
</form>
{{end}}

<details {{if not .HasKey}}open{{end}}>
  <summary>{{.L.settings}}</summary>
  <form method="post" action="/settings">
    <label>{{.L.language}}
      <select name="lang">
        {{range .Langs}}<option value="{{.}}" {{if eq . $.Lang}}selected{{end}}>{{index $.LangNames .}}</option>{{end}}
      </select>
    </label>
    <label>{{.L.tokenLabel}} <small>{{if .HasKey}}{{.L.tokenSaved}}{{else}}{{.L.tokenHowTo}}{{end}}</small>
      <input type="password" name="api_key" autocomplete="off">
    </label>
    <label>{{.L.logDirLabel}} <small>{{.L.logDirHelp}}</small>
      <input type="text" name="chatlog_dir" value="{{.ChatlogDir}}" autocomplete="off">
    </label>
    <button type="submit">{{.L.save}}</button>
  </form>
</details>
</body>
</html>
